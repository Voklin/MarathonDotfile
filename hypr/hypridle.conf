# ==============================================================================
# MARATHON Tactical — Hypridle Configuration (Isolated Session Profile)
# ==============================================================================
# Invoked cleanly via scripts/session-daemons.sh inside the isolated profile:
#   hypridle -c ~/.config/marathon-tactical/hypr/hypridle.conf
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock --config ~/.config/marathon-tactical/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
