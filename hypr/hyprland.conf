# ==============================================================================
# MARATHON Tactical — Isolated Hyprland Profile Entrypoint
# ==============================================================================
# Target Syntax: Modern hyprlang (Hyprland >= 0.53 with match: window/layer rules).
# Compatibility Note: Hyprland >= 0.55 transitions toward hyprland.lua; run
# `scripts/doctor.sh` on CachyOS to check `hyprctl version` before launching.
#
# Launch safely WITHOUT overwriting ~/.config/hypr/:
#   Hyprland --config ~/.config/marathon-tactical/hypr/hyprland.conf
# Status on Windows dev host: NOT RUN — requires CachyOS
# ==============================================================================

$marathonDir = $HOME/.config/marathon-tactical

# Core application defaults (override in ~/.config/marathon-tactical/hypr/local.conf)
$terminal = ghostty
$terminalFallback = alacritty
$fileManager = dolphin
$browser = firefox
$editor = nvim
$mediaPlayer = mpv
$imageViewer = imv
$pdfViewer = zathura
$systemMonitor = btop
$menuLauncher = qs ipc call marathon toggleLauncher

source = ./modules/env.conf
source = ./modules/monitors.conf
source = ./modules/input.conf
source = ./modules/appearance.conf
source = ./modules/animations.conf
source = ./modules/rules.conf
source = ./modules/binds.conf
source = ./modules/autostart.conf
source = ./user-settings.conf

