# ==============================================================================
# MARATHON Tactical — Hyprlock Configuration (Real PAM Authentication)
# ==============================================================================
# Palette synced with ui/tokens/Tokens.qml:
#   Void:       #040605
#   Background: #080B0A
#   Surface:    #141C18
#   Primary:    #C9FF16
#   Text:       #F0F4E8
#   Alert:      #FF4268
# ==============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = tactical, 0.2, 0.0, 0.0, 1.0
    animation = fadeIn, 1, 2, tactical
    animation = fadeOut, 1, 2, tactical
}

background {
    monitor =
    color = rgba(080B0Aff)
    # Stage 8 distraction-free geometric backdrop (uncomment when installed to ~/.config/marathon-tactical/):
    # path = ~/.config/marathon-tactical/design/wallpapers/marathon-lock-3840x2160.png
}

shape {
    monitor =
    size = 460, 210
    color = rgba(141C18ff)
    rounding = 0
    border_size = 1
    border_color = rgba(1E352Bff)
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = TERMINAL LOCKED // PAM AUTHENTICATION REQUIRED
    color = rgba(C9FF16ff)
    font_size = 11
    font_family = JetBrains Mono, monospace
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgba(F0F4E8ff)
    font_size = 54
    font_family = JetBrains Mono, monospace
    position = 0, 96
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b" | tr '[:lower:]' '[:upper:]'
    color = rgba(8C9B92ff)
    font_size = 12
    font_family = JetBrains Mono, monospace
    position = 0, 42
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 42
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.25
    dots_center = false
    outer_color = rgba(2F5343ff)
    inner_color = rgba(080B0Aff)
    font_color = rgba(F0F4E8ff)
    check_color = rgba(C9FF16ff)
    fail_color = rgba(FF4268ff)
    capslock_color = rgba(FFB020ff)
    fail_text = AUTH REJECTED // $FAIL ($ATTEMPTS)
    placeholder_text = <span foreground="##8C9B92">ENTER PASSPHRASE...</span>
    fade_on_empty = false
    rounding = 0
    position = 0, -48
    halign = center
    valign = center
}
