# Input configuration (predictable gaming/tactical pointer + dual-layout friendly)

input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    repeat_rate = 35
    repeat_delay = 250

    follow_mouse = 1
    sensitivity = 0.0
    accel_profile = flat

    touchpad {
        natural_scroll = false
        disable_while_typing = true
        tap-to-click = true
    }
}

