# MARATHON Tactical — Crisp Zero-Overshoot Motion Curves (120–180 ms)

animations {
    enabled = true

    bezier = marathonSnap, 0.2, 0.0, 0.0, 1.0
    bezier = marathonLinear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 2, marathonSnap, slide
    animation = windowsOut, 1, 2, marathonSnap, popin 92%
    animation = border, 1, 2, marathonLinear
    animation = fade, 1, 2, marathonSnap
    animation = workspaces, 1, 2, marathonSnap, slide
    animation = layers, 1, 2, marathonSnap, fade
}

