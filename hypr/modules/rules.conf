# ==============================================================================
# MARATHON Tactical — Modern Hyprland >= 0.53 Window & Layer Rules (match: syntax)
# ==============================================================================
# NOTE: windowrulev2 was deprecated and removed in Hyprland >= 0.53.
# Verify installed syntax on CachyOS with `hyprctl version` (`NOT RUN — requires CachyOS`).

# Utility & authentication dialogs float centered cleanly
windowrule {
    name = marathon-float-utilities
    match:class = ^(pavucontrol|org\.pulseaudio\.pavucontrol|nm-connection-editor|blueman-manager|polkit-gnome-authentication-agent-1|org\.kde\.polkit-kde-authentication-agent-1)$
    float = on
    center = on
}

# File picker / Wayland portals
windowrule {
    name = marathon-float-portals
    match:class = ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)$
    float = on
    center = on
}

# System monitors / TUI popouts
windowrule {
    name = marathon-float-tui-tools
    match:title = ^(marathon-btop|marathon-yazi)$
    float = on
    center = on
    size = 1120 720
}

# Image viewer & screenshot annotation float centered cleanly
windowrule {
    name = marathon-float-viewers
    match:class = ^(imv|com\.gabm\.satty|satty)$
    float = on
    center = on
}

# Common dialog titles
windowrule {
    name = marathon-float-dialogs
    match:title = ^(Open File|Save File|Confirm|Preferences|Settings)$
    float = on
    center = on
}

# Picture-in-Picture overlays stay floating & pinned
windowrule {
    name = marathon-pip
    match:title = ^(Picture-in-Picture|Picture in picture)$
    float = on
    pin = on
}

# Prevent idle sleep while fullscreen video/game window is active
windowrule {
    name = marathon-fullscreen-idleinhibit
    match:fullscreen = true
    idle_inhibit = focus
}

# Quickshell layer surfaces: disable compositor fade/blur so QML PanelReveal renders crisply
layerrule {
    name = marathon-shell-layers
    match:namespace = ^marathon-(hud|launcher|control-center|notifications|toasts|session|osd|settings|clipboard|capture|sysmon|calendar|cheatsheet|backdrop)$
    no_anim = on
    blur = off
}

