# ==============================================================================
# MARATHON Tactical — Keybindings & Safe Launcher Activation
# ==============================================================================
# Synced with docs/KEYBINDINGS.md
# Safety Policy: Bare single-key Super interception is NOT enabled by default so
# Super+* tiling chords never break unverified. Super+Space and Super+D are safe
# defaults; optional bare-Super release (`bindr`) is documented below for CachyOS tests.

$mainMod = SUPER

# --- Core Fallback Controls (independent of Quickshell health) ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $terminalFallback
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, T, exec, $terminal -e yazi
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, S, togglesplit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# --- MARATHON Tactical Shell Overlays (GlobalShortcut + Safe Fallbacks) ---
bind = $mainMod, comma, global, marathon-tactical:settings
bind = $mainMod, Space, global, marathon-tactical:launcher
bind = $mainMod, D, global, marathon-tactical:launcher
bind = $mainMod, C, global, marathon-tactical:control-center
bind = $mainMod, N, global, marathon-tactical:notifications
bind = $mainMod, X, global, marathon-tactical:session
bind = $mainMod SHIFT, E, global, marathon-tactical:session
bind = $mainMod SHIFT, V, global, marathon-tactical:clipboard
bind = , Print, global, marathon-tactical:capture
bind = $mainMod SHIFT, S, global, marathon-tactical:capture
bind = $mainMod, M, global, marathon-tactical:sysmon
bind = $mainMod, A, global, marathon-tactical:calendar
bind = $mainMod, slash, global, marathon-tactical:cheatsheet
bind = $mainMod, F1, global, marathon-tactical:cheatsheet
bind = $mainMod SHIFT, N, global, marathon-tactical:nightlight
bind = $mainMod, L, exec, hyprlock --config ~/.config/marathon-tactical/hypr/hyprlock.conf

# Optional bare-Super release trigger (enable ONLY after testing Super+* chords on CachyOS):
# bindr = SUPER, SUPER_L, global, marathon-tactical:launcher

# --- Focus Movement (Vim + Arrow keys; bracketright handles focus-right since Super+L is lock) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, bracketright, movefocus, r
bind = $mainMod, bracketleft, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Move Windows Across Tile Grid ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, bracketright, movewindow, r
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Resize Active Window ---
binde = $mainMod ALT, left, resizeactive, -40 0
binde = $mainMod ALT, right, resizeactive, 40 0
binde = $mainMod ALT, up, resizeactive, 0 -40
binde = $mainMod ALT, down, resizeactive, 0 40
binde = $mainMod ALT, H, resizeactive, -40 0
binde = $mainMod ALT, L, resizeactive, 40 0
binde = $mainMod ALT, K, resizeactive, 0 -40
binde = $mainMod ALT, J, resizeactive, 0 40

# --- Workspaces (1..9) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Cycle active monitor workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Mouse Drag Move & Resize ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Audio & Backlight Hardware Keys (PipeWire + brightnessctl + OSD signal) ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && qs ipc call marathon refreshBrightnessOsd
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && qs ipc call marathon refreshBrightnessOsd

# --- Emergency Shell Reload / Exit (always works even if UI hangs) ---
bind = $mainMod SHIFT, R, exec, pkill -x quickshell; quickshell -p ~/.config/marathon-tactical/shell/shell.qml
bind = $mainMod SHIFT CTRL, BackSpace, exit,
