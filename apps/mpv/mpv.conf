# MARATHON Tactical — mpv Minimal Tactical Media Player Config
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe
keep-open=yes
save-position-on-quit=yes
border=no

# Sharp Minimal Tactical OSD
osd-font="JetBrains Mono"
osd-font-size=22
osd-color="#FFF0F4E8"
osd-border-color="#FF080B0A"
osd-border-size=2
osd-back-color="#CC080B0A"
osd-bar-align-y=-0.9
osd-bar-h=1.5
osd-bar-w=65
osd-duration=1800

sub-font="Inter"
sub-font-size=38
sub-color="#FFF0F4E8"
sub-border-color="#FF080B0A"
sub-border-size=2

screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template=marathon-mpv-%F-%P
