# MARATHON Tactical — Yazi TUI File Manager Configuration
[mgr]
ratio          = [1, 3, 4]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]

[preview]
wrap            = "no"
tab_size        = 4
max_width       = 1200
max_height      = 1400
image_delay     = 20

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', desc = "Edit in $EDITOR", block = true, for = "unix" },
]
play = [
    { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
]
image = [
    { run = 'imv "$@"', orphan = true, for = "unix" },
]
pdf = [
    { run = 'zathura "$@"', orphan = true, for = "unix" },
]
open = [
    { run = 'xdg-open "$1"', desc = "Open with xdg-open", for = "unix" },
]

[open]
rules = [
    { mime = "text/*", use = ["edit", "open"] },
    { mime = "application/json", use = ["edit", "open"] },
    { mime = "image/*", use = ["image", "open"] },
    { mime = "{audio,video}/*", use = ["play", "open"] },
    { mime = "application/pdf", use = ["pdf", "open"] },
    { name = "*", use = ["edit", "open"] },
]
