# MARATHON Tactical — Foot Terminal Configuration
[main]
font=JetBrains Mono:size=11
pad=12x10 center
dpi-aware=yes
term=xterm-256color
include=~/.config/marathon-tactical/apps/generated/foot-colors.ini

[scrollback]
lines=20000

[cursor]
style=block
blink=no

[csd]
preferred=none
size=0
border-width=1

[mouse]
hide-when-typing=yes
