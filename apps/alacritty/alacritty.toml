# MARATHON Tactical — Alacritty Configuration

[general]
import = ["~/.config/marathon-tactical/apps/generated/alacritty-colors.toml"]

[window]
padding = { x = 12, y = 10 }
decorations = "None"
opacity = 0.96
dynamic_title = true

[scrolling]
history = 20000

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[cursor]
style = { shape = "Block", blinking = "Never" }

[selection]
save_to_clipboard = true
